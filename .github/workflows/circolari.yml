name: Circolari 2FI
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: circolari-2fi
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verifica filtri e gestione errori
        run: python -m unittest discover -s . -v
      - name: Controlla e invia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Salva memoria anche dopo errori parziali
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'circolari-bot'
            git config user.email 'circolari-bot@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Aggiorna stato circolari'
              git push
            fi
          fi
